# SDD / OpenSpec configuration for los-chillangos
# Generated by sdd-init on 2026-07-13. Safe to edit by hand.

project:
  name: los-chillangos
  description: CDMX E-Bike & Walking Tours website (tours/rentals)
  stack:
    framework: Next.js 15.4.11 (App Router)
    cms: Payload CMS 3.84.1
    database: Postgres (@payloadcms/db-postgres)
    language: TypeScript ~5.6 (ESM)
    package_manager: pnpm@11.1.1
    node: '>=20'
    i18n: next-intl
    other:
      - Stripe (payments)
      - Resend + React Email (src/emails)
      - S3 storage (@payloadcms/storage-s3)
      - Lexical richtext
      - Zod, MapLibre GL

conventions:
  collections_dir: src/collections
  globals_dir: src/globals
  components_dir: src/components
  payload_types: src/payload-types.ts
  path_alias: '@/* -> ./src/*'
  type_generation: pnpm generate:types  # payload generate:types

artifact_store:
  mode: openspec  # file-based artifacts under openspec/

testing:
  runner: vitest
  test_command: pnpm test          # vitest run
  watch_command: pnpm test:watch
  coverage_command: pnpm test:coverage
  e2e_command: pnpm e2e            # playwright test (Chromium only)
  typecheck_command: pnpm typecheck
  strict_tdd: false  # UI/CMS project; tests exist but no strict RED-GREEN discipline

phases:
  execution_mode: interactive
  delivery_strategy: single-pr-default
  review_budget_lines: 600
